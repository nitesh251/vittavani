services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vittavani
      POSTGRES_USER: vittavani
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vittavani -d vittavani"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
